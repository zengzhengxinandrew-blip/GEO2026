name: Deploy GeoLook

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: geolook-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Ubuntu server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          APP_DIR: ${{ secrets.APP_DIR }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          BRANCH: ${{ github.ref_name }}
          COMPOSE_PROFILES: ${{ secrets.COMPOSE_PROFILES }}
        run: |
          set -euo pipefail

          : "${SSH_HOST:?Missing SSH_HOST secret}"
          : "${SSH_USER:?Missing SSH_USER secret}"
          : "${SSH_KEY:?Missing SSH_KEY secret}"
          : "${APP_DIR:?Missing APP_DIR secret}"

          SSH_PORT="${SSH_PORT:-22}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/geolook_deploy_key
          chmod 600 ~/.ssh/geolook_deploy_key
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/geolook_deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "APP_DIR='$APP_DIR' REPO_URL='$REPO_URL' BRANCH='$BRANCH' COMPOSE_PROFILES='${COMPOSE_PROFILES:-}' bash -s" <<'REMOTE'
          set -euo pipefail

          if [ ! -d "$APP_DIR/.git" ]; then
            mkdir -p "$(dirname "$APP_DIR")"
            git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"
          fi

          cd "$APP_DIR"
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"

          if [ ! -f .env ]; then
            cp .env.example .env
            echo "Created .env from .env.example. Set GEOLOOK_TOKEN before exposing the service."
          fi

          if [ -n "${COMPOSE_PROFILES:-}" ]; then
            docker compose --profile "$COMPOSE_PROFILES" up -d --build
          else
            docker compose up -d --build geolook
          fi

          docker compose ps
          docker compose logs --tail=80 geolook
          REMOTE
